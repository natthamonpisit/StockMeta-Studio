<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockMeta Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // ROBUST POLYFILLS for Browser Compatibility
      // Prevents crashes from libraries expecting Node.js environment
      window.process = window.process || {
        env: {
          NODE_ENV: 'development',
          API_KEY: '' 
        },
        version: ''
      };
      window.global = window; // Some libs access 'global' instead of 'window'
    </script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#0f172a', // Slate 950
              surface: '#1e293b',    // Slate 800
              border: '#334155',     // Slate 700
              primary: '#3b82f6',    // Blue 500
              text: '#f8fafc',       // Slate 50
              muted: '#94a3b8',      // Slate 400
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0f172a;
        color: #f8fafc;
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@18.2.0/",
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/": "https://esm.sh/react-dom@18.2.0/",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1",
        "uuid": "https://esm.sh/uuid@9.0.0",
        "@google/genai": "https://esm.sh/@google/genai",
        "exifreader": "https://esm.sh/exifreader@4.20.0"
      }
    }
    </script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
